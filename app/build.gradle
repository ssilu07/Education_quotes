apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.royal.edunotes"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 15
        versionName "1.1.4"
        multiDexEnabled true
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true
    }
    useLibrary 'org.apache.http.legacy'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }
    packagingOptions {
        resources {
            // drop all copies of INDEX.LIST (from before)
            excludes += 'META-INF/INDEX.LIST'
            // and now also drop DEPENDENCIES
            excludes += 'META-INF/DEPENDENCIES'

            // if you see any others you can use pickFirst instead:
            // pickFirst += 'META-INF/DEPENDENCIES'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

configurations.all {
    resolutionStrategy {
        // Force an older Jackson core that targets Java 8
        force 'com.fasterxml.jackson.core:jackson-core:2.13.3'
    }
    // drop compile-only annotations & logging APIs from every configuration
    exclude group: 'com.google.errorprone',    module: 'error_prone_annotations'
    exclude group: 'org.slf4j',                module: 'slf4j-api'
    exclude group: 'com.google.auto.value',     module: 'auto-value'
}


dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'com.google.android.material:material:1.9.0'
    def lottieVersion = "3.4.0"

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation project(':navigationtabbar')
    implementation project(':library')
 //   implementation 'androidx.recyclerview:recyclerview:1.0.0'
  //  implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.vectordrawable:vectordrawable:1.0.0'
    implementation "com.airbnb.android:lottie:$lottieVersion"
//    implementation 'androidx.cardview:cardview:1.0.0'
  //  implementation 'androidx.appcompat:appcompat:1.0.0'
  //  implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
   // implementation 'com.baoyz.pullrefreshlayout:library:1.2.0'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'androidx.multidex:multidex:2.0.0'
    implementation 'com.readystatesoftware.sqliteasset:sqliteassethelper:2.0.1'
    implementation 'com.google.code.gson:gson:2.6.2'
    implementation 'com.google.android.gms:play-services-ads:22.4.0'
  /*  //Gemini
    implementation 'com.google.ai.client.generativeai:generativeai:0.6.0'*/
    // Google Gen AI Java SDK for Gemini Developer API
    implementation('com.google.genai:google-genai:0.6.1') {
        // remove compile-time only annotations & logging APIs
