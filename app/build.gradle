apply plugin: 'com.android.application'

android {
    namespace 'com.royal.edunotes'

    compileSdkVersion 34
    defaultConfig {
        applicationId "com.royal.edunotes"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 16
        versionName "1.2.0"
        multiDexEnabled true
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true
    }
    useLibrary 'org.apache.http.legacy'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }
    packagingOptions {
        resources {
            excludes += 'META-INF/INDEX.LIST'
            excludes += 'META-INF/DEPENDENCIES'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'com.fasterxml.jackson.core:jackson-core:2.13.3'
    }
    exclude group: 'com.google.errorprone',    module: 'error_prone_annotations'
    exclude group: 'org.slf4j',                module: 'slf4j-api'
    exclude group: 'com.google.auto.value',     module: 'auto-value'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // Updated AndroidX dependencies
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'

    def lottieVersion = "6.5.2"

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation project(':navigationtabbar')
    implementation project(':library')

    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'
    implementation "com.airbnb.android:lottie:$lottieVersion"
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'androidx.multidex:multidex:2.0.1'  // ✅ FIXED: Changed multidx to multidex
    implementation 'com.readystatesoftware.sqliteasset:sqliteassethelper:2.0.1'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Updated Google Play Services Ads
    implementation 'com.google.android.gms:play-services-ads:23.5.0'

    // Google Gen AI Java SDK for Gemini Developer API
    implementation('com.google.genai:google-genai:0.6.1') {
        exclude group: 'com.google.errorprone', module: 'error_prone_annotations'
        exclude group: 'org.slf4j',           module: 'slf4j-api'
        exclude group: 'com.google.auto.value', module: 'auto-value'
    }

    // Updated test dependencies
    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
}